# Render blueprint — provisions the database and the web service together.
#
# The point of declaring both here is that DATABASE_URL is wired from the
# database Render creates, so the connection string is never copied by hand
# into a dashboard, a file, or a chat window.
#
# Deploy: Render dashboard → New → Blueprint → pick this repository.

databases:
  - name: appointment-master-db
    databaseName: appointment_master
    user: appointment_master
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: appointment-master
    runtime: node
    plan: free
    # Closest region to India; change if your users are elsewhere, since every
    # page render makes several database round trips.
    region: singapore
    # `--include=dev` is load-bearing: Render sets NODE_ENV=production, which
    # makes npm skip devDependencies — and both the Next build (TypeScript,
    # Tailwind) and the migration step (drizzle-kit) live there.
    buildCommand: npm ci --include=dev && npm run build
    # Migrations run before the server starts rather than during the build.
    # They are idempotent — Drizzle records what it has applied — so a restart
    # re-checks and does nothing. Move this to a preDeployCommand if you scale
    # past one instance, so concurrent boots cannot race each other.
    startCommand: >-
      npm run migrate --workspace @appointment-master/db &&
      npm run start --workspace @appointment-master/web
    healthCheckPath: /
    envVars:
      # Render's Postgres is reached over the internal network, so one
      # connection string serves both roles: there is no separate pooler to
      # distinguish, unlike Supabase.
      - key: DATABASE_URL
        fromDatabase:
          name: appointment-master-db
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: appointment-master-db
          property: connectionString
      - key: NODE_VERSION
        value: "22"
